<script>
const v2=document.querySelector('#v2'),v1=document.querySelector('#v1'),all=[v2,v1];let comparison=false;
function seek(t){all.forEach(v=>{v.pause();v.currentTime=t})}
document.querySelector('#play').onclick=()=>{seek(0);v2.play();if(comparison)v1.play()};document.querySelector('#pause').onclick=()=>all.forEach(v=>v.pause());
document.querySelector('#compare').onclick=e=>{comparison=!comparison;document.querySelector('#players').classList.toggle('compare',comparison);e.target.setAttribute('aria-pressed',comparison);e.target.textContent=comparison?'Ver solo V2':'Comparar con V1';v1.currentTime=v2.currentTime;if(comparison&&!v2.paused)v1.play();else v1.pause()};
document.querySelector('#speed').onchange=e=>all.forEach(v=>v.playbackRate=Number(e.target.value));document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>seek(Number(b.dataset.time)));
v2.ontimeupdate=()=>{document.querySelector('#clock').textContent=`${v2.currentTime.toFixed(2)} s · f${Math.min(224,Math.floor(v2.currentTime*30)).toString().padStart(3,'0')}`;if(comparison&&!v2.paused&&Math.abs(v1.currentTime-v2.currentTime)>.08)v1.currentTime=v2.currentTime};v2.onended=()=>v1.pause();
// Buffer these short clips as local blobs when served over HTTP. This also
// makes exact seeking work with simple static servers without Range support.
if(location.protocol.startsWith('http')){
 const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
 Promise.all(all.map(async v=>{const response=await fetch(v.src);if(!response.ok)throw new Error('Video unavailable');const data=await response.blob();v.src=URL.createObjectURL(data);await new Promise((ok,bad)=>{v.onloadedmetadata=ok;v.onerror=bad})}))
 .finally(()=>buttons.forEach(b=>b.disabled=false));
}
</script></body></html>
